name: Update GEFS PM2.5
on:
  schedule:
    # GEFS runs 00/06/12/18 UTC; data complete ~5h later
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: gefs-update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q libeccodes0
      - run: pip install -r requirements.txt
      - run: python update_gefs.py data/gefs.json
      - name: Commit if changed
        run: |
          git config user.name "gefs-bot"
          git config user.email "gefs-bot@users.noreply.github.com"
          git add data/gefs.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "GEFS update $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
